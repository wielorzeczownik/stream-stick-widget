name: Security Audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: security-audit
  # Two overlapping runs would both push a fixed package-lock.json and race.
  cancel-in-progress: false

permissions: {}

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run audit
        id: audit
        shell: bash
        run: bash scripts/security-audit.sh

      - name: Commit fix (runtime advisory)
        if: ${{ steps.audit.outputs.changed == 'true' && steps.audit.outputs.production == 'true' }}
        uses: EndBug/add-and-commit@v10.0.0
        with:
          add: 'package-lock.json'
          default_author: github_actions
          message: 'fix(deps): resolve audit advisories'
          push: true

      - name: Commit fix (dev-only advisory)
        if: ${{ steps.audit.outputs.changed == 'true' && steps.audit.outputs.production == 'false' }}
        uses: EndBug/add-and-commit@v10.0.0
        with:
          add: 'package-lock.json'
          default_author: github_actions
          message: 'build(deps): resolve audit advisories'
          push: true

      - name: Create issue
        if: ${{ steps.audit.outputs.unresolved == 'true' }}
        uses: JasonEtco/create-an-issue@v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_REPORT: ${{ steps.audit.outputs.report }}
        with:
          filename: .github/security-advisory-issue.md
          assignees: ${{ github.repository_owner }}
          search_existing: open
          update_existing: true

      - name: Find advisory issue
        id: advisory_issue
        if: ${{ steps.audit.outputs.unresolved == 'false' }}
        uses: micalevisk/last-issue-action@v2.3.0
        with:
          labels: security-advisory
          state: open

      - name: Close advisory issue
        if: ${{ steps.audit.outputs.unresolved == 'false' && steps.advisory_issue.outputs.has-found == 'true' }}
        uses: peter-evans/close-issue@v3.0.2
        with:
          issue-number: ${{ steps.advisory_issue.outputs.issue-number }}
          comment: '`npm audit` no longer reports advisories.'
