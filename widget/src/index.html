<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Stream Stick</title>
    <link href="styles/index.scss" rel="stylesheet" />
    <script type="module" src="scripts/index.ts"></script>
  </head>
  <body>
    <div id="widget">
      <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js';
        globalThis.THREE = THREE;
      </script>
      <script src="https://cdn.jsdelivr.net/npm/@tixyel/streamelements@7.14.1/dist/index.umd.js"></script>
      <canvas id="scene"></canvas>
    </div>

    <div id="development-panel" class="development-panel">
      <div class="development-panel__header">Dev Panel – Stick out</div>

      <div class="development-panel__section">
        <div class="development-panel__section-title">
          Stick angle (degrees)
        </div>
        <input
          id="development-angle"
          type="range"
          max="180"
          min="-180"
          value="-65"
        />
        <span id="development-angle-value">-65°</span>
      </div>

      <div class="development-panel__section">
        <div class="development-panel__section-title">Skin</div>
        <select id="development-skin">
          <option value="wood">Wood</option>
          <option value="minecraft">Minecraft – Stick</option>
          <option value="minecraft_pickaxe">Minecraft – Pickaxe</option>
          <option value="custom">Custom (URL below)</option>
        </select>
        <input
          id="development-custom-skin-url"
          type="text"
          placeholder="URL własnej tekstury"
          spellcheck="false"
        />
      </div>

      <div class="development-panel__section">
        <div class="development-panel__section-title">Hold duration (s)</div>
        <input
          id="development-hold-duration"
          type="number"
          max="30"
          min="0"
          step="0.1"
          value="1.2"
        />
      </div>

      <div class="development-panel__section">
        <div class="development-panel__section-title">Censorship</div>
        <select id="development-censor-style">
          <option value="none">None</option>
          <option value="pixel">Pixelate</option>
        </select>
      </div>

      <div class="development-panel__section">
        <div class="development-panel__section-title">Animation</div>
        <button id="development-anim-direct">Direct (UI only)</button>
        <button id="development-anim-command">via chat command</button>
        <button id="development-anim-points">via Channel Points</button>
      </div>
    </div>
  </body>
</html>
